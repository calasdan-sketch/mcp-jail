name: release
on:
  push: {tags: ["v*"]}
permissions: {contents: read}
jobs:
  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the tests
        run: |
          python -m unittest discover -s tests
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: tagged commit must be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. Merge it first, then tag main."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: tag must equal package version
        run: |
          python - <<'PY'
          import glob, os, re
          files = glob.glob("dist/*")
          assert files, "dist/ is empty"
          for f in files:
              v = re.search(r"-(\d[^-]*?)(?:\.tar\.gz|-py3)", os.path.basename(f)).group(1)
              assert os.environ["GITHUB_REF_NAME"] == "v" + v, (os.environ["GITHUB_REF_NAME"], f)
          PY
      - name: the tests pass from the sdist
        run: |
          mkdir "$RUNNER_TEMP/sdist"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist"
          cd "$RUNNER_TEMP/sdist"/*/
          python -m unittest discover -s tests
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/}
  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions: {id-token: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1

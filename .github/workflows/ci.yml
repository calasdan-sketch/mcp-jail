name: ci
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: python -m unittest discover -s tests
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: the tests pass from the sdist
        run: |
          mkdir "$RUNNER_TEMP/sdist"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist"
          cd "$RUNNER_TEMP/sdist"/*/
          python -m unittest discover -s tests
      - name: the wheel installs and runs
        run: |
          python -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/v/bin/mcp-jail" --version
  wheel-smoke:
    # The wheel, installed into a clean virtual environment, on the systems
    # people run it on: the console script exists where pip puts it
    # (Scripts\ on Windows, bin/ elsewhere) and a real session passes through.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install build
      - run: python -m build --wheel
      - name: install the wheel and run the console script
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/v"
          if [ -d "$RUNNER_TEMP/v/Scripts" ]; then bindir=Scripts; else bindir=bin; fi
          "$RUNNER_TEMP/v/$bindir/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/v/$bindir/mcp-jail" --version
          "$RUNNER_TEMP/v/$bindir/mcp-jail" --init-policy --strict --path "$RUNNER_TEMP/p.json"
          "$RUNNER_TEMP/v/$bindir/mcp-jail" --init-policy --pack git --path "$RUNNER_TEMP/g.json"
          "$RUNNER_TEMP/v/$bindir/mcp-jail" --audit

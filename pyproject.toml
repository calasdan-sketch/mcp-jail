[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-jail"
version = "0.6.2"
description = "Runtime permission firewall for MCP servers (stdio proxy)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Security",
]

[project.scripts]
mcp-jail = "mcp_jail.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_jail*"]
